<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>เข้าสู่ระบบห้องสมุด</title>
</head>
<body class="min-h-screen bg-slate-50">
    <!-- Header (เหมือนหน้าแรก) -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-500 shadow-md">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white tracking-wide">ห้องสมุดวิทยาลัย</h1>
                <nav>
                    <ul class="flex gap-8">
                        <li><a href="index.html" class="text-white hover:text-blue-100 transition-colors duration-200 font-medium">หน้าแรก</a></li>
                        <li><a href="#" class="text-white hover:text-blue-100 transition-colors duration-200 font-medium">หนังสือ</a></li>
                        <li><a href="login.html" class="text-blue-100 font-medium">ติดต่อ</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex items-center justify-center min-h-[calc(100vh-180px)] px-4 py-12">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 w-full max-w-md">
            <!-- Logo/Icon -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full shadow-sm mb-4">
                    <span class="text-3xl">📚</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-1">เข้าสู่ระบบ</h2>
                <p class="text-slate-600 text-sm">ห้องสมุดวิทยาลัย</p>
            </div>

            <!-- Login Form -->
            <form class="space-y-5">
                <!-- Username Input -->
                <div>
                    <label class="block text-slate-700 font-medium mb-2 text-sm">ชื่อผู้ใช้</label>
                    <input type="text" placeholder="กรุณากรอกชื่อผู้ใช้"
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-slate-800">
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-slate-700 font-medium mb-2 text-sm">รหัสผ่าน</label>
                    <input type="password" placeholder="กรุณากรอกรหัสผ่าน"
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-slate-800">
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-slate-600 cursor-pointer">
                        <input type="checkbox" class="mr-2 rounded border-slate-300">
                        <span>จดจำฉันไว้</span>
                    </label>
                    <a href="#" class="text-blue-600 hover:text-blue-700 font-medium transition-colors duration-200">ลืมรหัสผ่าน?</a>
                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium shadow-sm transition-colors duration-200">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-slate-500">หรือเข้าสู่ระบบด้วย</span>
                </div>
            </div>

            <!-- Social Login Buttons -->
            <div class="space-y-3">
                <!-- Google Login -->
                <button type="button"
                        class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:border-slate-400 hover:bg-slate-50 text-slate-700 py-2.5 rounded-lg font-medium transition-all duration-200 shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>เข้าสู่ระบบด้วย Google</span>
                </button>

                <!-- Facebook Login -->
                <button type="button"
                        class="w-full flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium transition-colors duration-200 shadow-sm">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    <span>เข้าสู่ระบบด้วย Facebook</span>
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center mt-6">
                <p class="text-slate-600 text-sm">
                    ยังไม่มีบัญชี? 
                    <a href="#" class="text-blue-600 hover:text-blue-700 font-medium transition-colors duration-200">สมัครสมาชิก</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer (เหมือนหน้าแรก) -->
    <footer class="bg-slate-800 text-slate-300 py-6">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm">© 2025 ห้องสมุดวิทยาลัย สงวนลิขสิทธิ์</p>
        </div>
    </footer>
</body>
</html>
